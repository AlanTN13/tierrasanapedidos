const paths={grid:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',sales:'M3 6h18 M7 3v6 M17 3v6 M5 6v15h14V6 M8 13h8 M8 17h5',buy:'M3 3h2l3 12h10l3-9H6 M9 20h.01 M18 20h.01',box:'m3 7 9-4 9 4v10l-9 4-9-4z M3 7l9 4 9-4 M12 11v10 M7 5l9 4',stock:'M4 7h13 M14 3l4 4-4 4 M20 17H7 M10 13l-4 4 4 4',home:'m3 10 9-7 9 7 M5 8v13h14V8 M9 21v-8h6v8',tag:'M3 3h8l10 10-8 8L3 11z M7 7h.01',book:'M12 5C8 2 3 3 3 3v16s5-1 9 2c4-3 9-2 9-2V3s-5-1-9 2v16',search:'m21 21-5-5 M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',plus:'M12 5v14 M5 12h14',arrow:'M5 12h14 M14 7l5 5-5 5',calendar:'M3 6h18v15H3z M7 3v6 M17 3v6 M3 11h18',alert:'m12 3 10 18H2z M12 9v5 M12 18h.01',down:'M12 3v12 M7 10l5 5 5-5 M4 17v4h16v-4',menu:'M4 6h16 M4 12h16 M4 18h16',check:'m5 12 4 4L19 6'};
const icon=(name)=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.box}"/></svg>`;
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const productData=[
{id:1,name:'Mix con avellanas',sku:'MIX-AVELLANAS',cat:'Frutos secos y snack',price:6200,cost:16000,stock:1.75,unit:'kg',state:'Activo',presentations:['250g','500g','1kg']},
{id:2,name:'Chía premium',sku:'CHIA-PREMIUM',cat:'Semillas',price:3390,cost:7800,stock:.8,unit:'kg',state:'Activo',presentations:['100g','250g','500g']},
{id:3,name:'Granola crocante',sku:'GRANOLA-CROCANTE',cat:'Cereales y granolas',price:3390,cost:null,stock:2.5,unit:'kg',state:'Activo',presentations:['250g','500g']},
{id:4,name:'Chips de chocolate negro',sku:'CHIPS-CHOCOLATE',cat:'Repostería',price:3200,cost:7200,stock:-.25,unit:'kg',state:'Activo',presentations:['100g','250g','500g']},
{id:5,name:'Maní sin sal',sku:'MANI-SIN-SAL',cat:'Frutos secos y snack',price:2100,cost:3100,stock:3.2,unit:'kg',state:'Activo',presentations:['250g','500g','1kg']},
{id:6,name:'Hibiscus · Flor de Jamaica',sku:'HIBISCUS',cat:'Infusiones y hierbas',price:3900,cost:null,stock:.1,unit:'kg',state:'Activo',presentations:['100g','250g']},
{id:7,name:'Avena instantánea',sku:'AVENA-INSTANTANEA',cat:'Cereales y granolas',price:890,cost:1800,stock:4,unit:'kg',state:'Activo',presentations:['250g','500g','1kg']},
{id:8,name:'Barrita de cereal',sku:'BARRITA-CEREAL',cat:'Galletitas y barras',price:1900,cost:1100,stock:0,unit:'u.',state:'Inactivo',presentations:['unidad']}
];
const saleData=[
{id:'DEMO-1049',date:'19 oct · 16:42',day:19,client:'Cliente de ejemplo A',total:12300,items:3,cost:'registered',margin:3890,product:'Mix con avellanas'},
{id:'DEMO-1048',date:'19 oct · 14:18',day:19,client:'',total:9150,items:2,cost:'missing',margin:null,product:'Granola crocante'},
{id:'DEMO-1047',date:'18 oct · 18:06',day:18,client:'Cliente de ejemplo B',total:18900,items:4,cost:'estimated',margin:5340,product:'Chips de chocolate negro'},
{id:'DEMO-1046',date:'18 oct · 11:24',day:18,client:'',total:6200,items:1,cost:'registered',margin:2200,product:'Mix con avellanas'},
{id:'DEMO-1045',date:'17 oct · 17:51',day:17,client:'Cliente de ejemplo C',total:14980,items:3,cost:'registered',margin:4380,product:'Chía premium'},
{id:'DEMO-1044',date:'16 oct · 12:36',day:16,client:'',total:3900,items:1,cost:'missing',margin:null,product:'Hibiscus'},
{id:'DEMO-1043',date:'15 oct · 16:09',day:15,client:'Cliente de ejemplo D',total:7890,items:2,cost:'registered',margin:2510,product:'Avena instantánea'},
{id:'DEMO-1042',date:'15 oct · 09:50',day:15,client:'',total:11300,items:3,cost:'registered',margin:3400,product:'Maní sin sal'}
];
const modules=[['resumen','Resumen','grid','/admin'],['ventas','Ventas','sales','/admin/sales'],['compras','Compras','buy','/admin/purchases'],['productos','Productos','box','/admin/products'],['inventario','Inventario','stock','/admin/stock-movements'],['home','Home de la web','home','/admin/home'],['categorias','Categorías','tag','/admin/categories'],['recetas','Recetas','book','/admin/recipes']];
let view='resumen',query='',filter='all',stateFilter='all',period='octubre',page=1,pageSize=8,entryRows=[{productId:1,presentation:'250g',quantity:1,price:6200}],catalogQuery='';
document.getElementById('menu-toggle').innerHTML=icon('menu');
function closeNav(){document.getElementById('shell').classList.remove('nav-open');document.getElementById('menu-toggle').setAttribute('aria-expanded','false')}
function toggleNav(){const open=document.getElementById('shell').classList.toggle('nav-open');document.getElementById('menu-toggle').setAttribute('aria-expanded',String(open))}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNav()});
function renderNav(){document.getElementById('nav').innerHTML=modules.map((m,i)=>(i===0?'<p class="nav-title">Operación</p>':i===5?'<p class="nav-title">Administración web</p>':'')+`<a href="#${m[0]}" class="${view===m[0]||(view==='nueva-venta'&&m[0]==='ventas')?'active':''}" ${view===m[0]?'aria-current="page"':''}>${icon(m[2])}<span>${m[1]}</span></a>`).join('')}
function pageHeader(title,sub,actions='',eyebrow='Gestión comercial'){return `<div class="page-head"><div><p class="eyebrow">${eyebrow}</p><h1>${title}</h1><p class="subtitle">${sub}</p></div><div class="actions">${actions}</div></div>`}
const newSale=()=>`<a href="#nueva-venta" class="btn primary">${icon('plus')}Nueva venta</a>`;
const periodSelect=()=>`<label class="period">${icon('calendar')}<select aria-label="Período" onchange="period=this.value;page=1;refresh()"><option value="octubre" ${period==='octubre'?'selected':''}>Octubre 2026</option><option value="septiembre" ${period==='septiembre'?'selected':''}>Septiembre 2026</option></select></label>`;
function metric(label,value,foot,ico='sales',warn=false){return `<article class="metric"><div class="label">${label}${icon(ico)}</div><strong class="${warn?'caution-value':''}">${value}</strong><p class="foot">${foot}</p></article>`}
const costBadge=s=>s.cost==='missing'?'<span class="badge danger">Sin costo confirmado</span>':s.cost==='estimated'?'<span class="badge warn">Costo estimado</span>':'<span class="badge ok">Costo registrado</span>';
const salesForPeriod=()=>period==='octubre'?saleData:[];
function filteredSales(){return salesForPeriod().filter(s=>(!query||norm([s.id,s.client,s.product].join(' ')).includes(norm(query)))&&(filter==='all'||(filter==='review'&&s.cost!=='registered')||(filter==='unidentified'&&!s.client)))}
function saleRows(data,compact=false){return data.map(s=>`<tr><td class="primary-cell" data-label="Operación"><strong>${s.id}</strong><small>${s.date}</small></td><td class="mobile-secondary" data-label="Cliente">${s.client?esc(s.client):'<span class="muted">Sin identificar</span>'}</td>${compact?'':`<td class="mobile-hide" data-label="Ítems">${s.items}</td>`}<td class="num" data-label="Total"><strong>${money(s.total)}</strong></td><td data-label="Calidad del costo">${costBadge(s)}</td>${compact?'':`<td class="num mobile-hide" data-label="Margen estimado">${s.margin===null?'—':money(s.margin)}<small>${s.cost==='missing'?'No concluyente':s.cost==='estimated'?'Estimado':'Según costo registrado'}</small></td>`}<td class="action-cell num"><button class="table-action" aria-label="Ver ${s.id}" onclick="saleDetail('${s.id}')">Ver detalle ↗</button></td></tr>`).join('')}
function dashboard(){const sales=salesForPeriod(),total=sales.reduce((a,s)=>a+s.total,0),review=sales.filter(s=>s.cost!=='registered').length;return pageHeader('Resumen comercial','Una vista clara de la operación y los datos que necesitan atención.',periodSelect()+newSale())+`<div class="metrics">${metric('Ventas registradas',money(total),'Total del período seleccionado','sales')}${metric('Operaciones',sales.length,'Registros de venta, sin deduplicar','grid')}${metric('Ticket promedio',sales.length?money(total/sales.length):'—','Mismo conjunto de ventas del período','tag')}${metric('Margen bruto estimado',review?'No concluyente':sales.length?money(sales.reduce((a,s)=>a+(s.margin||0),0)):'—',review?`${review} operaciones con costos a revisar`:'Según los costos registrados','alert',review>0)}</div>`+(review?`<div class="alert-strip"><div>${icon('alert')}<span>Los costos incompletos o estimados limitan la lectura del margen. No equivalen a costo cero.</span></div><a href="#ventas" class="btn text" onclick="filter='review'">Revisar operaciones ${icon('arrow')}</a></div>`:'')+`<div class="grid-two"><section class="panel"><div class="panel-head"><div><h2>Actividad del período</h2><p>Ventas registradas · importes de ejemplo</p></div><span class="badge">ARS</span></div><div class="panel-body"><div class="mini-grid"><div><p class="tiny muted">VENTAS</p><p class="mini-total">${money(total)}</p></div><div><p class="tiny muted">COMPRAS</p><p class="mini-total">${money(sales.length?64500:0)}</p><p class="tiny muted">2 órdenes ilustrativas</p></div></div><div class="trend" role="img" aria-label="Ventas de ejemplo por día: 15, 16, 17, 18 y 19 de octubre">${[15,16,17,18,19].map(day=>{const n=sales.filter(s=>s.day===day).reduce((a,s)=>a+s.total,0);return `<div class="bar-wrap" title="${day} oct: ${money(n)}"><div class="bar" style="height:${Math.round(n/280)}%"></div><span>${day} oct</span></div>`}).join('')}</div><p class="tiny muted" style="margin-top:10px">Vista ilustrativa. Sin comparación porcentual contra períodos no disponibles.</p></div></section><section class="panel"><div class="panel-head"><div><h2>Mayor rotación</h2><p>Presentaciones vendidas · ejemplo visual</p></div><a class="btn text" href="#productos">Ver catálogo ↗</a></div><div class="panel-body ranking">${(sales.length?[['Mix con avellanas','250g',5],['Maní sin sal','500g',4],['Chips de chocolate','250g',3],['Chía premium','250g',2],['Avena instantánea','500g',2]]:[]).map((p,i)=>`<div class="rank"><span class="rank-number">0${i+1}</span><div><strong>${p[0]}</strong><span class="muted"> · ${p[1]}</span><div class="track"><i style="width:${p[2]*18}%"></i></div></div><b>${p[2]}</b></div>`).join('')||'<p class="empty">Sin operaciones en este período.</p>'}</div></section></div><div class="grid-two"><section class="panel"><div class="panel-head"><div><h2>Últimas ventas</h2><p>Operaciones dentro del período</p></div><a class="btn text" href="#ventas">Ver todas ↗</a></div><div class="table-scroll"><table class="responsive-table"><thead><tr><th>Operación</th><th>Cliente</th><th class="num">Total</th><th>Costo</th><th></th></tr></thead><tbody>${saleRows(sales.slice(0,4),true)||'<tr><td colspan="5" class="empty">Sin ventas para mostrar.</td></tr>'}</tbody></table></div></section><section class="panel"><div class="panel-head"><div><h2>Atención de inventario</h2><p>Stock base actual · independiente del período</p></div><span class="badge warn">3 productos</span></div>${[4,6,8].map(id=>{const p=productData.find(p=>p.id===id);return `<div class="stock-line"><div><strong>${p.name}</strong><small>${p.stock<0?'Saldo negativo para revisar':p.stock===0?'Sin disponibilidad':'Alcanza el umbral de alerta'}</small></div><div class="num"><span class="badge ${p.stock<0?'danger':'warn'}">${String(p.stock).replace('.',',')} ${p.unit}</span><br><button class="table-action" onclick="productDetail(${p.id})">Revisar</button></div></div>`}).join('')}</section></div><p class="page-note">Propuesta visual con datos ficticios. “Registrado” describe el origen del dato; no certifica cobro ni exactitud histórica. Las alertas no corrigen saldos automáticamente.</p>`}
function salesPage(){return pageHeader('Ventas','Encontrá una operación, revisá sus ítems o registrá una venta.',`<button class="btn" onclick="exportExample()">${icon('down')}Exportar ejemplo</button>`+newSale(),'Operación')+`<div class="metrics" id="sales-metrics"></div><section class="panel"><div class="toolbar"><label class="search">${icon('search')}<input id="search" aria-label="Buscar ventas" placeholder="Código, cliente o producto…" value="${esc(query)}" oninput="query=this.value;page=1;updateSales()"></label>${periodSelect()}</div><div class="filter-row" id="sale-filters"></div><div class="table-scroll"><table class="responsive-table"><thead><tr><th>Operación / fecha</th><th>Cliente</th><th>Ítems</th><th class="num">Total</th><th>Calidad del costo</th><th class="num">Margen estimado</th><th></th></tr></thead><tbody id="sale-body"></tbody></table></div><div class="table-foot" id="sale-footer"></div></section><p class="page-note">Totales de ejemplo sobre todo el resultado filtrado, independientes de la página. Esta semántica se validará al conectar los registros existentes. Cliente continúa siendo el texto opcional actual.</p>`}
function updateSales(){const data=filteredSales(),total=data.reduce((a,s)=>a+s.total,0),review=data.filter(s=>s.cost!=='registered').length;document.getElementById('sales-metrics').innerHTML=metric('Total del resultado',money(total),`${data.length} operaciones filtradas`)+metric('Operaciones',data.length,'Alcance: período y filtros','grid')+metric('Ticket promedio',data.length?money(total/data.length):'—','Total / operaciones filtradas','tag')+metric('Costos a revisar',review,'Faltantes y estimados, sin imputar','alert',review>0);document.getElementById('sale-filters').innerHTML=[['all','Todas'],['review','Costos a revisar'],['unidentified','Sin cliente identificado']].map(([key,label])=>`<button class="chip ${filter===key?'active':''}" aria-pressed="${filter===key}" onclick="filter='${key}';page=1;updateSales()">${label}</button>`).join('')+`<span class="result-count" role="status">${data.length} resultados</span>`+(filter!=='all'||query?'<button class="clear" onclick="query=\'\';filter=\'all\';page=1;refresh()">Limpiar filtros</button>':'');document.getElementById('sale-body').innerHTML=saleRows(data.slice((page-1)*pageSize,page*pageSize))||'<tr><td colspan="7" class="empty">No hay ventas con estos filtros. Probá otro período o limpiá la búsqueda.</td></tr>';const pages=Math.max(1,Math.ceil(data.length/pageSize));document.getElementById('sale-footer').innerHTML=`<span>${data.length?Math.min(data.length,(page-1)*pageSize+1):0}–${Math.min(data.length,page*pageSize)} de ${data.length} ventas</span><div class="actions"><label>Por página <select class="select" aria-label="Ventas por página" onchange="pageSize=Number(this.value);page=1;updateSales()"><option ${pageSize===4?'selected':''}>4</option><option ${pageSize===8?'selected':''}>8</option></select></label><button class="btn small" aria-label="Página anterior" ${page===1?'disabled':''} onclick="page--;updateSales()">‹</button><span>${page} / ${pages}</span><button class="btn small" aria-label="Página siguiente" ${page>=pages?'disabled':''} onclick="page++;updateSales()">›</button></div>`}
function filteredProducts(){return productData.filter(p=>(!query||norm([p.name,p.sku,p.cat].join(' ')).includes(norm(query)))&&(stateFilter==='all'||p.state===stateFilter)&&(filter==='all'||(filter==='critical'&&p.stock<=.25)||(filter==='missing'&&p.cost===null)))}
function productsPage(){return pageHeader('Productos','Catálogo, presentaciones y stock en una misma vista.',`<button class="btn" onclick="showInfo('Nuevo producto','Se conservará la ruta /admin/products/new y el manejo de errores del 19/10. El formulario se adapta después de validar esta propuesta.')">${icon('plus')}Nuevo producto</button>`,'Operación')+`<div class="summary-chips"><span><strong>8</strong> productos de ejemplo</span><span><strong>7</strong> activos</span><span><strong>2</strong> sin costo informado</span><span><strong>1</strong> con saldo negativo</span></div><section class="panel"><div class="toolbar"><label class="search">${icon('search')}<input aria-label="Buscar productos" placeholder="Nombre, SKU o categoría…" value="${esc(query)}" oninput="query=this.value;updateProducts()"></label><select class="select" aria-label="Estado del producto" onchange="stateFilter=this.value;updateProducts()"><option value="all">Todos los estados</option><option ${stateFilter==='Activo'?'selected':''}>Activo</option><option ${stateFilter==='Inactivo'?'selected':''}>Inactivo</option></select></div><div class="filter-row" id="product-filters"></div><div class="table-scroll"><table class="responsive-table"><thead><tr><th>Producto / SKU</th><th>Categoría</th><th>Presentaciones</th><th class="num">Precio desde</th><th class="num">Último costo base</th><th class="num">Stock base</th><th>Estado</th><th></th></tr></thead><tbody id="product-body"></tbody></table></div><div class="legend"><span><i class="dot"></i> Costo por kg o unidad, no por paquete</span><span><i class="dot red"></i> Un saldo negativo requiere revisión</span></div></section><p class="page-note">Precios, costos y saldos ilustrativos. El detalle conserva las equivalencias y las presentaciones; ninguna alerta ajusta inventario ni modifica un costo.</p>`}
function updateProducts(){const data=filteredProducts();document.getElementById('product-filters').innerHTML=[['all','Todos'],['critical','Stock crítico'],['missing','Sin costo informado']].map(([key,label])=>`<button class="chip ${filter===key?'active':''}" aria-pressed="${filter===key}" onclick="filter='${key}';updateProducts()">${label}</button>`).join('')+`<span class="result-count" role="status">${data.length} de ${productData.length} productos</span>`+(filter!=='all'||query||stateFilter!=='all'?'<button class="clear" onclick="query=\'\';filter=\'all\';stateFilter=\'all\';refresh()">Limpiar filtros</button>':'');document.getElementById('product-body').innerHTML=data.map(p=>`<tr><td class="primary-cell" data-label="Producto"><strong>${p.name}</strong><small>${p.sku}</small></td><td class="mobile-secondary" data-label="Categoría">${p.cat}</td><td class="mobile-hide" data-label="Presentaciones">${p.presentations.length}<small>${p.presentations.slice(0,2).join(' · ')}${p.presentations.length>2?'…':''}</small></td><td class="num" data-label="Precio desde"><strong>${money(p.price)}</strong><small>${p.presentations[0]}</small></td><td class="num mobile-hide" data-label="Último costo">${p.cost===null?'<span class="badge warn">Sin informar</span>':money(p.cost)+`<small>por ${p.unit==='kg'?'kg':'unidad'}</small>`}</td><td class="num" data-label="Stock base"><strong style="color:${p.stock<0?'var(--red)':p.stock<=.25?'var(--warn)':'inherit'}">${String(p.stock).replace('.',',')} ${p.unit}</strong>${p.stock<=.25?`<small>${p.stock<0?'Saldo negativo':'Stock crítico'}</small>`:''}</td><td class="mobile-hide" data-label="Estado"><span class="badge ${p.state==='Activo'?'ok':''}">${p.state}</span></td><td class="action-cell num"><button class="table-action" aria-label="Ver ${p.name}" onclick="productDetail(${p.id})">Ver / editar ↗</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">No hay productos con estos filtros.</td></tr>'}
function openDetail(title,kicker,body){document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-kicker').textContent=kicker;document.getElementById('dialog-body').innerHTML=body;document.getElementById('detail').showModal()}
function showInfo(title,text){openDetail(title,'Alcance de la propuesta',`<p class="small-text muted" style="line-height:1.8">${esc(text)}</p><div class="notice">Esta pantalla es una propuesta de diseño. No hay cambios en el sistema real.</div>`)}
function saleDetail(id){const s=saleData.find(s=>s.id===id);openDetail(s.id,'Detalle de venta · ejemplo',`<div class="detail-grid"><div><span>FECHA Y HORA</span><strong>${s.date} · 2026</strong></div><div><span>CLIENTE</span><strong>${s.client||'Sin identificar'}</strong></div><div><span>TOTAL REGISTRADO</span><strong>${money(s.total)}</strong></div><div><span>CALIDAD DEL COSTO</span>${costBadge(s)}</div></div>${s.cost!=='registered'?`<div class="notice error">${s.cost==='missing'?'El costo no está confirmado. El margen no permite una conclusión fiable.':'Este costo es estimado. El valor no se presenta como costo histórico confirmado.'}</div>`:''}<div class="drawer-section"><h3>Ítems de la operación</h3><div class="detail-item"><div>${s.product}<small>Presentación y cantidades de ejemplo</small></div><b>${s.items} ítems</b></div><div class="summary-line total"><span>Total</span><span>${money(s.total)}</span></div></div><div class="drawer-section"><h3>Trazabilidad</h3><p class="small-text muted">Se conservará el detalle actual de cada ítem, el costo registrado o estimado, las notas y el código de venta. Los posibles duplicados se revisan; no se eliminan automáticamente.</p></div>`)}
function productDetail(id){const p=productData.find(p=>p.id===id);openDetail(p.name,'Producto · ejemplo',`<div class="detail-grid"><div><span>SKU BASE</span><strong>${p.sku}</strong></div><div><span>ESTADO</span><strong>${p.state}</strong></div><div><span>CATEGORÍA</span><strong>${p.cat}</strong></div><div><span>STOCK BASE</span><strong>${String(p.stock).replace('.',',')} ${p.unit}</strong></div><div><span>ÚLTIMO COSTO CONOCIDO</span><strong>${p.cost===null?'Sin informar':money(p.cost)+' / '+p.unit}</strong></div></div>${p.stock<0?'<div class="notice error">Saldo negativo. Revisar movimientos y equivalencias sin corregir automáticamente.</div>':''}<div class="drawer-section"><h3>Presentaciones</h3>${p.presentations.map((label,i)=>`<div class="detail-item"><div>${label}<small>${p.sku}-${label.toUpperCase()}</small></div><div class="num">${money(p.price*(i+1))}<small>Precio ilustrativo</small></div></div>`).join('')}</div><div class="drawer-section"><h3>Edición y errores</h3><p class="small-text muted">La edición real mantiene su ruta y las validaciones publicadas. Un SKU duplicado conserva campos e imagen y dirige al campo que debe corregirse.</p><button class="btn" style="margin-top:13px" onclick="showInfo('Edición del producto','En la implementación se conserva /admin/products/[slug], sus campos, presentaciones archivadas y validaciones. Esta demo no modifica productos.')">Ver alcance de edición</button></div>`)}
function entryPage(){return pageHeader('Nueva venta','Carga rápida, presentación exacta y total siempre a mano.',`<a href="#ventas" class="btn">Volver a ventas</a>`,'Ventas')+`<form id="sale-demo-form" onsubmit="simulateSave(event)"><div class="entry-grid"><div><section class="panel"><div class="panel-head"><h2>Datos de la operación</h2><span class="badge">Ejemplo</span></div><div class="panel-body fields"><label class="field">Fecha y hora<input type="datetime-local" value="2026-10-19T16:45" required></label><label class="field">Nombre del cliente <span class="tiny muted">Opcional · texto actual, sin maestro nuevo</span><input placeholder="Nombre del cliente"></label><label class="field full">Observaciones<textarea rows="2" placeholder="Aclaraciones de la venta (opcional)"></textarea></label></div></section><section class="panel" style="margin-top:16px"><div class="panel-head"><div><h2>Productos de la venta</h2><p>Elegí producto y presentación. El stock base mantiene su conversión actual.</p></div><button type="button" class="btn small" onclick="entryRows.push({productId:0,presentation:'',quantity:1,price:0});renderEntryRows()">${icon('plus')}Agregar fila</button></div><div class="entry-search"><label class="search" style="display:block;max-width:none">${icon('search')}<input aria-label="Buscar para agregar" placeholder="Buscar un producto para agregar…" oninput="catalogQuery=this.value;entrySearch()"></label><div id="entry-results" class="actions" style="margin-top:8px"></div></div><div id="entry-rows"></div></section></div><aside class="panel sticky-summary"><div class="panel-head"><h2>Resumen de la venta</h2></div><div class="panel-body"><div class="summary-line"><span class="muted">Productos</span><strong id="entry-count"></strong></div><div class="summary-line total"><span>Total</span><span id="entry-total"></span></div><p class="tiny muted" style="margin:11px 0 16px">Importes de ejemplo en ARS. El margen depende de la calidad del costo de cada ítem.</p><button type="submit" class="btn primary wide">${icon('check')}Simular guardado</button><div id="entry-notice" class="notice" role="status" hidden></div><p class="tiny muted" style="margin-top:13px">El prototipo no guarda ni descuenta stock. El formulario real conserva el manejo de errores del 19/10.</p></div></aside></div></form><div class="mobile-sale-total"><div><small>Total de ejemplo</small><strong id="mobile-entry-total"></strong></div><button type="button" class="btn primary" onclick="document.querySelector('.sticky-summary').scrollIntoView({block:'center'})">Ver resumen ↓</button></div>`}
function entrySearch(){const target=document.getElementById('entry-results');if(!catalogQuery){target.innerHTML='';return}const data=productData.filter(p=>p.state==='Activo'&&norm(p.name+' '+p.sku).includes(norm(catalogQuery)));target.innerHTML=data.map(p=>`<button type="button" class="btn small" onclick="addEntry(${p.id})">${icon('plus')}${p.name}</button>`).join('')||'<p class="tiny muted">No encontramos ese producto en los ejemplos.</p>'}
function addEntry(id){const p=productData.find(p=>p.id===id);entryRows.push({productId:id,presentation:p.presentations[0],quantity:1,price:p.price});catalogQuery='';renderEntryRows();document.querySelector('[aria-label="Buscar para agregar"]').value='';entrySearch()}
function renderEntryRows(){document.getElementById('entry-rows').innerHTML=entryRows.map((r,i)=>{const p=productData.find(p=>p.id===r.productId);return `<div class="entry-item"><label class="field">Producto<select aria-label="Producto fila ${i+1}" onchange="changeEntryProduct(${i},Number(this.value))"><option value="0">Elegir producto</option>${productData.filter(p=>p.state==='Activo').map(p=>`<option value="${p.id}" ${p.id===r.productId?'selected':''}>${p.name}</option>`).join('')}</select></label><label class="field">Presentación<select aria-label="Presentación fila ${i+1}" onchange="changeEntryPresentation(${i},this.value)">${(p?.presentations||['Elegir producto']).map(v=>`<option ${v===r.presentation?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">Cantidad<input aria-label="Cantidad fila ${i+1}" type="number" min="1" step="1" value="${r.quantity}" required oninput="entryRows[${i}].quantity=Number(this.value);updateEntryTotal()"></label><label class="field">Precio ARS<input aria-label="Precio fila ${i+1}" type="number" min="1" value="${r.price||''}" required oninput="entryRows[${i}].price=Number(this.value);updateEntryTotal()"></label><button type="button" class="btn remove" aria-label="Quitar fila ${i+1}" onclick="entryRows.splice(${i},1);renderEntryRows()">×</button><div class="line-total" id="line-${i}"></div></div>`}).join('');updateEntryTotal()}
function changeEntryProduct(i,id){const p=productData.find(p=>p.id===id);entryRows[i]={productId:id,presentation:p?.presentations[0]||'',quantity:1,price:p?.price||0};renderEntryRows()}
function changeEntryPresentation(i,label){const p=productData.find(p=>p.id===entryRows[i].productId);const base=label=>label==='unidad'?1:label.endsWith('kg')?Number(label.replace('kg',''))*1000:Number(label.replace('g',''));entryRows[i].presentation=label;entryRows[i].price=p?Math.round(p.price*base(label)/base(p.presentations[0])):0;renderEntryRows()}
function updateEntryTotal(){document.getElementById('entry-count').textContent=entryRows.filter(r=>r.productId).length;document.getElementById('entry-total').textContent=money(entryRows.reduce((a,r)=>a+r.quantity*r.price,0));document.getElementById('mobile-entry-total').textContent=document.getElementById('entry-total').textContent;entryRows.forEach((r,i)=>{document.getElementById('line-'+i).textContent='Subtotal: '+money(r.quantity*r.price)})}
function simulateSave(event){event.preventDefault();const message=document.getElementById('entry-notice');message.hidden=false;message.textContent=entryRows.length&&entryRows.every(r=>r.productId&&r.quantity>0&&r.price>0)?'Simulación completada. No se guardó ninguna venta ni se modificó stock.':'Revisá las filas: falta un producto, una cantidad o un precio. Los datos cargados se conservan.';message.classList.toggle('error',!entryRows.length||entryRows.some(r=>!r.productId||r.quantity<=0||r.price<=0))}
function modulePlaceholder(key){const m=modules.find(m=>m[0]===key)||modules[0];return pageHeader(m[1],'El módulo se conserva. Su adaptación seguirá el estándar visual validado.','','Módulo existente')+`<section class="panel route-placeholder"><span class="badge info">Etapa 2 · referencia de alcance</span><h2>El mismo circuito, una experiencia consistente.</h2><p>Esta primera propuesta detalla Resumen, Ventas y Productos. ${m[1]} conserva su funcionalidad y ruta actual; su implementación visual espera validación. No se agregan módulos de Casa Italia.</p><div class="route-map"><div><strong>Ruta a preservar</strong><span class="path">${m[3]}</span></div><div><strong>Operaciones y registros existentes</strong><span>Sin cambios</span></div><div><strong>Diseño propuesto</strong><span>Shell, filtros, tablas y formularios comunes</span></div></div><a href="#resumen" class="btn" style="margin-top:22px">Volver a la propuesta de Resumen</a></section>`}
function mobileWeb(){const cats=[['Frutos secos y snack','frutos-secos-y-snack'],['Semillas','semillas'],['Harinas y premezclas','harinas-y-premezclas'],['Sin TACC','sin-tacc'],['Cereales y granolas','cereales-y-granolas'],['Dulces y untables','dulces-y-untables'],['Sin azúcar','sin-azucar'],['Legumbres','legumbres'],['Arroces y oriental','arroces-y-oriental'],['Condimentos y especias','condimentos-y-especias'],['Galletitas y barras','galletitas'],['Repostería','reposteria'],['Aceites y salsas','aceites-y-salsas-de-soja']];return pageHeader('Categorías siempre visibles','Corrección independiente del ERP. Ejemplo de grilla móvil sin expansión.',`<a href="#resumen" class="btn">Volver al ERP V3</a>`,'Web mobile')+`<div class="mobile-demo"><div class="mobile-demo-header"><strong style="color:var(--olive)">Tierra Sana</strong>${icon('search')}</div><h2 class="demo-title">Categorías</h2><div class="category-grid">${cats.map(c=>`<div class="category-card"><img src="/categorias-optimized/${c[1]}.webp" alt=""><span>${c[0]}</span></div>`).join('')}</div><p class="mobile-demo-foot">Todas las categorías de este ejemplo están a la vista. Sin botón “Ver más” y sin desplazamiento horizontal.</p></div><p class="page-note">La corrección real renderizará todas las categorías recibidas de la Home y conservará exactamente sus imágenes, nombres, orden y enlaces. Esta referencia visual no reemplaza esos datos ni modifica la Home actual.</p>`}
function exportExample(){showInfo('Exportación de ventas','El CSV real se conserva en /admin/export/sales. Esta propuesta no conecta datos reales ni genera un reporte comercial con los ejemplos de pantalla.')}
function refresh(){const main=document.getElementById('main');main.innerHTML=view==='resumen'?dashboard():view==='ventas'?salesPage():view==='productos'?productsPage():view==='nueva-venta'?entryPage():view==='web-mobile'?mobileWeb():modulePlaceholder(view);if(view==='ventas')updateSales();if(view==='productos')updateProducts();if(view==='nueva-venta')renderEntryRows()}
function navigate(){const next=location.hash.slice(1)||'resumen';view=[...modules.map(m=>m[0]),'nueva-venta','web-mobile'].includes(next)?next:'resumen';query='';stateFilter='all';if(!(view==='ventas'&&filter==='review'))filter='all';page=1;document.getElementById('breadcrumb').textContent=view==='nueva-venta'?'Nueva venta':view==='web-mobile'?'Web mobile':modules.find(m=>m[0]===view)?.[1]||'Resumen';renderNav();refresh();closeNav();window.scrollTo(0,0);if(location.hash)document.getElementById('main').focus({preventScroll:true})}
window.addEventListener('hashchange',navigate);navigate();
</script></body></html>
